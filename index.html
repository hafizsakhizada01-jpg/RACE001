<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار اختصاصی رئیس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #020617;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Tahoma, Geneva, sans-serif;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.5) 0%, #020617 100%),
                        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 100%, 100% 4px;
            z-index: 1;
        }
        .container {
            text-align: center;
            z-index: 5;
            width: 90%;
            max-width: 500px;
        }
        .avatar-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ai-core {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f2fe 0%, rgba(79, 172, 254, 0.4) 50%, transparent 100%);
            box-shadow: 0 0 60px 20px rgba(0, 242, 254, 0.6), inset 0 0 40px #00f2fe;
            position: relative;
            z-index: 2;
            transition: all 0.5s ease;
        }
        .wave-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(0, 242, 254, 0.3);
            animation: pulse-ring 2s linear infinite;
        }
        .wave-ring:nth-child(2) { animation-delay: 0.7s; }
        .wave-ring:nth-child(3) { animation-delay: 1.4s; }
        
        .orbit-lines {
            position: absolute;
            width: 115%;
            height: 115%;
            border: 1px dashed rgba(0, 242, 254, 0.2);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }
        .status-box {
            margin: 25px 0;
        }
        .status-text {
            font-size: 18px;
            letter-spacing: 1px;
            color: #00f2fe;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }
        .caption-box {
            min-height: 70px;
            color: #cbd5e1;
            font-size: 15px;
            margin-bottom: 30px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(10px);
            line-height: 1.6;
        }
        .glow-btn {
            padding: 16px 45px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            color: #020617;
            border-radius: 35px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(0, 242, 254, 0.9);
        }
        .processing {
            background: radial-gradient(circle, #f59e0b 0%, rgba(245, 158, 11, 0.4) 50%, transparent 100%) !important;
            box-shadow: 0 0 80px 30px rgba(245, 158, 11, 0.7), inset 0 0 40px #f59e0b !important;
        }
        .speaking {
            background: radial-gradient(circle, #ec4899 0%, rgba(236, 72, 153, 0.4) 50%, transparent 100%) !important;
            box-shadow: 0 0 80px 30px rgba(236, 72, 153, 0.7), inset 0 0 40px #ec4899 !important;
            animation: jitter 0.1s infinite alternate;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse-ring {
            0% { transform: scale(0.7); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        @keyframes jitter {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-container">
            <div class="wave-ring"></div>
            <div class="wave-ring"></div>
            <div class="wave-ring"></div>
            <div class="orbit-lines"></div>
            <div class="ai-core" id="aiCore"></div>
        </div>
        
        <div class="status-box">
            <div class="status-text" id="statusLabel">وضعیت: آماده به کار</div>
        </div>

        <div class="caption-box" id="captionText">در خدمت شما هستم رئیس، دکمه زیر را لمس کنید...</div>

        <button class="glow-btn" id="actionBtn">شروع گفتگو با دستیار</button>
    </div>

    <script>
        const actionBtn = document.getElementById('actionBtn');
        const statusLabel = document.getElementById('statusLabel');
        const captionText = document.getElementById('captionText');
        const aiCore = document.getElementById('aiCore');

        actionBtn.addEventListener('click', () => {
            const userQuestion = prompt("رئیس، دستور خود را اینجا بنویسید:");
            
            if (userQuestion && userQuestion.trim() !== "") {
                captionText.innerText = "دستور رئیس: " + userQuestion;
                processSpeech(userQuestion);
            }
        });

        function processSpeech(text) {
            statusLabel.innerText = "وضعیت: در حال پردازش دستور رئیس...";
            statusLabel.style.color = "#f59e0b";
            aiCore.className = "ai-core processing";
            
            // تنظیم پاسخ پیش‌فرض و وفادارانه برای رئیس
            let reply = "رئیس من، در خدمتم! هر دستوری بفرمایید اجرا می‌کنم.";
            
            if(text.includes("سلام") || text.includes("درود")) {
                reply = "سلام رئیس بزرگ! من در خدمتم، دستور شما چیست؟";
            } else if(text.includes("چطوری") || text.includes("حالت چطور است")) {
                reply = "به لطف شما رئیس، تمام سیستم‌های من روی صد درصد و آماده به کار هستند.";
            } else if(text.includes("اسم") || text.includes("نام تو")) {
                reply = "من دستیار صوتی وفادار شما هستم رئیس.";
            }

            setTimeout(() => {
                playLiveVoice(reply);
            }, 600);
        }

        function playLiveVoice(text) {
            statusLabel.innerText = "وضعیت: در حال پاسخ‌دهی...";
            statusLabel.style.color = "#ec4899";
            captionText.innerText = "پاسخ دستیار: " + text;
            aiCore.className = "ai-core speaking";
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fa-IR';
                utterance.rate = 0.95;
                
                utterance.onend = () => { resetToReady(); };
                utterance.onerror = () => { resetToReady(); };
                
                window.speechSynthesis.speak(utterance);
            } else {
                setTimeout(resetToReady, 4000);
            }
        }

        function resetToReady() {
            statusLabel.innerText = "وضعیت: آماده به کار";
            statusLabel.style.color = "#00f2fe";
            aiCore.className = "ai-core";
        }
    </script>
</body>
</html>
