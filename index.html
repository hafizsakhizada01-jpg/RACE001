<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار اختصاصی رئیس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #020617;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Tahoma, Geneva, sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .ai-core {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f2fe 0%, rgba(79, 172, 254, 0.4) 50%, transparent 100%);
            box-shadow: 0 0 60px 20px rgba(0, 242, 254, 0.6), inset 0 0 40px #00f2fe;
            margin: 0 auto 40px;
            transition: all 0.3s ease;
        }
        .status-box {
            margin: 25px 0;
        }
        .status-text {
            font-size: 18px;
            color: #00f2fe;
            font-weight: bold;
        }
        .caption-box {
            min-height: 70px;
            color: #cbd5e1;
            font-size: 15px;
            margin-bottom: 30px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 242, 254, 0.2);
        }
        .glow-btn {
            padding: 16px 45px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            color: #020617;
            border-radius: 35px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            transition: all 0.2s ease;
        }
        .glow-btn:active {
            transform: scale(0.95);
        }
        .speaking {
            background: radial-gradient(circle, #ec4899 0%, rgba(236, 72, 153, 0.4) 50%, transparent 100%) !important;
            box-shadow: 0 0 80px 30px rgba(236, 72, 153, 0.7), inset 0 0 40px #ec4899 !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="ai-core" id="aiCore"></div>
        
        <div class="status-box">
            <div class="status-text" id="statusLabel">وضعیت: آماده به کار</div>
        </div>

        <div class="caption-box" id="captionText">در خدمت شما هستم رئیس، دکمه زیر را لمس کنید...</div>

        <button class="glow-btn" id="actionBtn" onclick="playVoice()">شروع گفتگو با دستیار</button>
    </div>

    <!-- این تگ یک فایل صوتی واقعی و آنلاین را برای تست هندل می‌کند -->
    <audio id="realAudio"></audio>

    <script>
        const statusLabel = document.getElementById('statusLabel');
        const captionText = document.getElementById('captionText');
        const aiCore = document.getElementById('aiCore');
        const realAudio = document.getElementById('realAudio');

        function playVoice() {
            captionText.innerText = "پاسخ دستیار: رئیس من، در خدمتم!";
            statusLabel.innerText = "وضعیت: در حال پاسخ‌دهی...";
            statusLabel.style.color = "#ec4899";
            aiCore.className = "ai-core speaking";

            // اتصال مستقیم به یک فایل صوتی آنلاین واقعی برای پخش عمومی و بدون خطا
            realAudio.src = "https://google.com"; 
            
            realAudio.play().then(() => {
                realAudio.onended = () => { resetToReady(); };
            }).catch(e => {
                // در صورت مسدود بودن، موتور داخلی بک‌آپ فعال می‌شود
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance("رئیس من، در خدمتم!");
                    utterance.lang = 'fa-IR';
                    utterance.onend = () => { resetToReady(); };
                    window.speechSynthesis.speak(utterance);
                } else {
                    setTimeout(resetToReady, 3000);
                }
            });
        }

        function resetToReady() {
            statusLabel.innerText = "وضعیت: آماده به کار";
            statusLabel.style.color = "#00f2fe";
            aiCore.className = "ai-core";
        }
    </script>
</body>
</html>
