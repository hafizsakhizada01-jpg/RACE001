<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انجنیر حفیظ الله - دستیار هوشمند</title>
    <style>
        :root {
            --bg-color: #050b14;
            --card-bg: #0d1624;
            --accent-blue: #00a2ff;
            --accent-green: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8fa0b5;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .header {
            margin-bottom: 20px;
        }

        .status {
            color: var(--accent-green);
            font-size: 14px;
            margin-top: 5px;
        }

        .network-status {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .ai-face {
            width: 100px;
            height: 100px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .eyes {
            display: flex;
            gap: 25px;
        }

        .eye {
            width: 12px;
            height: 12px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .eye.blinking {
            animation: blink 4s infinite;
        }

        .mouth {
            width: 40px;
            height: 15px;
            border-bottom: 4px solid var(--accent-blue);
            border-radius: 0 0 20px 20px;
            transition: all 0.3s ease;
        }

        .ai-face.talking .left-eye {
            transform: scaleY(0.2);
        }
        
        .ai-face.talking .mouth {
            height: 25px;
            width: 50px;
            border-bottom: 4px solid var(--accent-green);
            box-shadow: 0 4px 10px rgba(0, 255, 136, 0.3);
        }

        .ai-face.talking .right-eye {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .chat-box {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            min-height: 120px;
            margin-bottom: 20px;
            text-align: right;
            border: 1px solid #1a2638;
            line-height: 1.6;
        }

        .chat-box a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #121e30;
            border: 1px solid #1a2638;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: inherit;
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 25px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>انجنیر حفیظ الله</h2>
        <div class="status">● آماده به کار</div>
        <div id="net-status" class="network-status">متصل به شبکه</div>
    </div>

    <div id="robot-face" class="ai-face">
        <div class="eyes">
            <div class="eye left-eye blinking"></div>
            <div class="eye right-eye blinking"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <div id="response-box" class="chat-box">
        پاسخ دستیار در اینجا نمایش داده می‌شود...
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="با دستیار خود گپ بزنید...">
        <button onclick="sendToAI()">ارسال</button>
    </div>
</div>

<script>
    let absenceTimer;
    const ABSENCE_TIME = 120000; 

    function triggerFaceReaction() {
        const face = document.getElementById('robot-face');
        if(face) {
            face.classList.add('talking');
            setTimeout(() => {
                face.classList.remove('talking');
            }, 4000);
        }
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fa-IR'; 
            utterance.rate = 1.0;     
            window.speechSynthesis.speak(utterance);
            triggerFaceReaction();
        }
    }

    function resetAbsenceTimer() {
        clearTimeout(absenceTimer);
        absenceTimer = setTimeout(() => {
            const msg = "ریس امروز دفتر نبودی چیزی مشکل پیش آمده بگویه تا هر دوی ما یک جای هل کنیم";
            document.getElementById('response-box').innerHTML = "<strong>دستیار (پیام غیبت):</strong> " + msg;
            speak(msg);
            if (navigator.vibrate) navigator.vibrate(300); 
        }, ABSENCE_TIME);
    }

    window.addEventListener('click', resetAbsenceTimer);
    window.addEventListener('keypress', resetAbsenceTimer);
    resetAbsenceTimer(); 

    async function checkBattery() {
        if ('getBattery' in navigator) {
            const battery = await navigator.getBattery();
            return Math.round(battery.level * 100);
        }
        return null;
    }

    function getMyLocation(responseBox) {
        if (navigator.geolocation) {
            responseBox.innerHTML = "در حال دریافت موقعیت مکانی...";
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const replyText = "ریس موقعیت شما با موفقیت پیدا شد.";
                    
                    responseBox.innerHTML = "<strong>دستیار:</strong> " + replyText + "<br><a href='https://google.com" + lat + "," + lon + "' target='_blank'>📍 مشاهده مکان روی نقشه گوگل</a>";
                    
                    speak(replyText);
                },
                () => {
                    const errorMsg = "دسترسی به لوکیشن ناموفق بود. مطمئن شوید GPS روشن است.";
                    responseBox.innerHTML = "<strong>دستیار:</strong> " + errorMsg;
                    speak(errorMsg);
                }
            );
        }
    }

    async function sendToAI() {
        resetAbsenceTimer(); 
        const inputField = document.getElementById('user-input');
        const responseBox = document.getElementById('response-box');
        const userText = inputField.value.trim();

        if (userText === "") return;

        responseBox.innerHTML = "در حال پردازش...";
        inputField.value = "";
        triggerFaceReaction();

        if (userText === "سلام" || userText === "سلام ریس") {
            setTimeout(() => {
                const reply = "سلام ریس خوش امدی من خدمت دستیار شما";
                responseBox.innerHTML = "<strong>دستیار:</strong> " + reply;
                speak(reply); 
                if (navigator.vibrate) navigator.vibrate(100);
            }, 500);
            return;
        }

        if (userText === "موقعیت من" || userText === "لوکیشن" || userText === "کجا هستم") {
            getMyLocation(responseBox);
            return;
        }

        if (userText === "وضعیت باتری" || userText === "باتری چنده") {
            const batteryLevel = await checkBattery();
            setTimeout(() => {
                if (batteryLevel !== null) {
                    const reply = "ریس، شارژ باتری گوشی شما در حال حاضر " + batteryLevel + " درصد است.";
                    responseBox.innerHTML = "<strong>دستیار:</strong> " + reply;
                    speak(reply);
                } else {
                    responseBox.innerHTML = "<strong>دستیار:</strong> عدم دسترسی به باتری.";
                }
            }, 500);
            return;
        }

        if (userText === "گوشی را بلرزان" || userText === "ویبره بزن") {
            setTimeout(() => {
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                    const reply = "دستور انجام شد، گوشی شما لرزید ریس.";
                    responseBox.innerHTML = "<strong>دستیار:</strong> " + reply;
                    speak(reply);
                }
            }, 500);
            return;
        }

        responseBox.innerHTML = "پیام شما دریافت شد ریس.";
    }
</script>

</body>
</html>
