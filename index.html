<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار صوتی هوشمند</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #030712;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Tahoma, Geneva, sans-serif;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 2;
            pointer-events: none;
        }
        .container {
            text-align: center;
            z-index: 5;
            width: 90%;
            max-width: 500px;
        }
        .ai-core {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.8) 0%, rgba(79, 172, 254, 0.2) 60%, transparent 100%);
            box-shadow: 0 0 80px 20px rgba(0, 242, 254, 0.4), inset 0 0 60px rgba(0, 242, 254, 0.6);
            margin: 0 auto 30px;
            position: relative;
            transition: all 0.5s ease;
        }
        .orbit {
            position: absolute;
            top: -15px; left: -15px; right: -15px; bottom: -15px;
            border-radius: 50%;
            border: 2px solid rgba(0, 242, 254, 0.2);
            border-top: 2px solid #00f2fe;
            border-bottom: 2px solid #4facfe;
            animation: spin 4s linear infinite;
        }
        .orbit-fast {
            position: absolute;
            top: -30px; left: -30px; right: -30px; bottom: -30px;
            border-radius: 50%;
            border: 1px dashed rgba(0, 242, 254, 0.4);
            animation: spin-reverse 8s linear infinite;
        }
        .status-box {
            margin: 25px 0;
        }
        .status-text {
            font-size: 16px;
            letter-spacing: 2px;
            color: #00f2fe;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }
        .caption-box {
            min-height: 60px;
            color: #9ca3af;
            font-size: 15px;
            margin-bottom: 30px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            line-height: 1.6;
        }
        .glow-btn {
            padding: 15px 40px;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: #030712;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
        }
        .listening {
            background: radial-gradient(circle, rgba(234, 179, 8, 0.8) 0%, rgba(234, 179, 8, 0.2) 60%, transparent 100%) !important;
            box-shadow: 0 0 90px 30px rgba(234, 179, 8, 0.5), inset 0 0 60px rgba(234, 179, 8, 0.6) !important;
            animation: pulse 1s infinite ease-in-out;
        }
        .speaking {
            background: radial-gradient(circle, rgba(236, 72, 153, 0.8) 0%, rgba(236, 72, 153, 0.2) 60%, transparent 100%) !important;
            box-shadow: 0 0 90px 30px rgba(236, 72, 153, 0.5), inset 0 0 60px rgba(236, 72, 153, 0.6) !important;
            animation: pulse 0.6s infinite ease-in-out;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="ai-core" id="aiCore">
            <div class="orbit"></div>
            <div class="orbit-fast"></div>
        </div>
        
        <div class="status-box">
            <div class="status-text" id="statusLabel">وضعیت: آماده به کار</div>
        </div>

        <div class="caption-box" id="captionText">برای شروع دکمه زیر را فشار داده و صحبت کنید...</div>

        <button class="glow-btn" id="actionBtn">شروع گفتگو</button>
    </div>

    <script>
        const actionBtn = document.getElementById('actionBtn');
        const statusLabel = document.getElementById('statusLabel');
        const captionText = document.getElementById('captionText');
        const aiCore = document.getElementById('aiCore');

        // استفاده از سیستم صوتی بازسازی شده سازگار با اندروید و آیفون
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition || null;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                statusLabel.innerText = "وضعیت: در حال شنیدن...";
                statusLabel.style.color = "#eab308";
                captionText.innerText = "دستیار در حال گوش دادن است...";
                aiCore.className = "ai-core listening";
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                captionText.innerText = "شما گفتید: " + text;
                processSpeech(text);
            };

            recognition.onerror = (e) => {
                console.error(e);
                resetToReady("خطا در سیستم صوتی. لطفاً مطمئن شوید دسترسی به میکروفون باز است.");
            };
        }

        actionBtn.addEventListener('click', () => {
            // فعال‌سازی اولیه موتور صوتی برای دور زدن محدودیت مرورگر موبایل
            window.speechSynthesis.cancel();
            
            if (recognition) {
                try {
                    recognition.start();
                } catch(e) {
                    recognition.stop();
                }
            } else {
                // راهکار جایگزین در صورت مسدود بودن کامل میکروفون توسط مرورگر گوشی
                const testText = prompt("سیستم تشخیص خودکار صدا مسدود است. سوال خود را اینجا تایپ کنید:");
                if(testText) processSpeech(testText);
            }
        });

        function processSpeech(text) {
            statusLabel.innerText = "وضعیت: در حال پردازش...";
            statusLabel.style.color = "#a855f7";
            
            let reply = "درخواست شما دریافت شد. من یک دستیار صوتی هوشمند هستم.";
            if(text.includes("سلام")) reply = "سلام! روز شما بخیر. چطور می‌توانم کمکتان کنم؟";
            if(text.includes("چطوری") || text.includes("حالت چطوره")) reply = "سیستم من کاملاً پایدار و آماده به کار است.";
            if(text.includes("اسم") || text.includes("نام")) reply = "من دستیار صوتی اختصاصی شما هستم.";

            setTimeout(() => {
                speakOutput(reply);
            }, 800);
        }

        function speakOutput(text) {
            // موتور صوتی تقویت شده فارسی
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fa-IR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            
            utterance.onstart = () => {
                statusLabel.innerText = "وضعیت: در حال پاسخ‌دهی...";
                statusLabel.style.color = "#ec4899";
                captionText.innerText = "پاسخ دستیار: " + text;
                aiCore.className = "ai-core speaking";
            };

            utterance.onend = () => {
                resetToReady("آماده برای گفتگوی بعدی.");
            };

            window.speechSynthesis.speak(utterance);
        }

        function resetToReady(msg) {
            statusLabel.innerText = "وضعیت: آماده به کار";
            statusLabel.style.color = "#00f2fe";
            captionText.innerText = msg;
            aiCore.className = "ai-core";
        }
    </script>
</body>
</html>
